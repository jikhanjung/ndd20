<!doctype html>
<meta charset="utf-8">
<title>{% block title %}NDD20{% endblock %}</title>
<style>
  :root { --bg:#0b0f14; --panel:#141b23; --line:#26303c; --ink:#e6edf3;
          --dim:#8b98a5; --ok:#4ade80; --warn:#ffd479; --bad:#f87171;
          --mask:#38bdf8; --base:#f0abfc; --card:200px }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.6 "IBM Plex Sans KR", system-ui, sans-serif }
  a { color:#9fe6ff; text-decoration:none } a:hover { text-decoration:underline }
  header { border-bottom:1px solid var(--line); padding:9px 14px;
           display:flex; gap:12px; align-items:center; flex-wrap:wrap }
  h1 { font-size:15px; margin:0; font-weight:600 }
  .dim { color:var(--dim); font-size:12.5px }
  select, button, input { font:inherit; font-size:13px; background:var(--panel);
    color:var(--ink); border:1px solid var(--line); border-radius:5px;
    padding:3px 9px }
  /* **칸을 줄 높이에 맞춰 늘이지 않는다**(`align-items:start`). 늘이면 그림은
     제 높이로 위에 남는데 SVG 는 칸을 다 덮어, 윤곽이 사진 아래 빈 곳에
     그려진다. 틀 가로/세로가 0.56~3.27 로 널뛰어 한 줄 안에서 늘 어긋난다 */
  #grid { display:grid; gap:9px; padding:12px; align-items:start;
          grid-template-columns:repeat(auto-fill, minmax(var(--card), 1fr)) }
  .fin { position:relative; background:#0d1219; border:1px solid var(--line);
         border-radius:6px; overflow:hidden }
  .fin img { display:block; width:100%; height:auto }
  .fin svg { position:absolute; inset:0; width:100%; height:100%;
             pointer-events:none }
  /* **셋이 겹쳐 있고 색이 곧 출처다.** 초록은 남이 그린 것, 파랑은 우리가 낸
     것, 분홍은 밑동. 색을 섞어 쓰면 겹쳐 놓은 뜻이 없어진다 */
  .fin polyline.fence { fill:none; stroke:var(--ok); stroke-width:1.6;
                        vector-effect:non-scaling-stroke; opacity:.85 }
  .fin.open polyline.fence { stroke:var(--warn) }
  .fin polygon.mask { fill:#38bdf826; stroke:var(--mask); stroke-width:1.7;
                      vector-effect:non-scaling-stroke }
  /* 담김이 낮은 것은 **칸째** 붉어야 한다 — 격자에서 눈에 걸려야 하는 것들이다 */
  .fin.low { border-color:var(--bad) }
  .fin.low polygon.mask { fill:#f8717133; stroke:var(--bad) }
  .fin.nomask { border-color:#7f1d1d }
  /* 밑동은 두 점이지만 **현으로 긋는다.** 점 두 개를 원으로 찍으면 틀 가로세로
     비가 1이 아니라(preserveAspectRatio=none) 찌그러진 타원이 된다 */
  .fin polyline.base { fill:none; stroke:var(--base); stroke-width:3.4;
                       stroke-linecap:round; vector-effect:non-scaling-stroke }
  body.no-fence .fence, body.no-mask .mask, body.no-base .base { display:none }
  .tag { position:absolute; left:4px; top:4px; z-index:2; font-size:11px;
         background:#000a; border-radius:4px; padding:1px 5px }
  .tag.id { color:var(--ok) } .tag.no { color:var(--dim) }
  .gap { position:absolute; right:4px; top:4px; z-index:2; font-size:11px;
         color:var(--warn); background:#000a; border-radius:4px; padding:1px 5px }
  .hold { position:absolute; left:4px; bottom:4px; z-index:2; font-size:11px;
          color:var(--mask); background:#000a; border-radius:4px; padding:1px 5px }
  .hold.bad { color:var(--bad) }
  .pager { padding:10px 14px; display:flex; gap:8px; align-items:center }
  .key { display:inline-flex; gap:9px; align-items:center }
  .key i { width:11px; height:3px; border-radius:2px; display:inline-block }
</style>
<header>
  <h1><a href="/">NDD20</a></h1>
  {% block head %}{% endblock %}
  <span style="flex:1"></span>
  <span class="key dim">
    <label><i style="background:var(--ok)"></i>
      <input type="checkbox" id="t-fence" checked> 남의 윤곽</label>
    <label><i style="background:var(--mask)"></i>
      <input type="checkbox" id="t-mask" checked> 우리 마스크</label>
    <label><i style="background:var(--base)"></i>
      <input type="checkbox" id="t-base" checked> 밑동</label>
  </span>
</header>
{% block body %}{% endblock %}
<script>
// **얹은 것은 브라우저가 그린다** — 켜고 끌 수 있어야 그림과 좌표가 갈렸을 때
// 어느 쪽이 틀렸는지 가린다 (형제 저장소의 `/edit` 과 같은 까닭).
// **셋을 따로 끈다.** 겹친 채로는 우리 마스크가 어긋난 것인지 남의 윤곽이
// 헐거운 것인지 안 갈린다 — 그것을 가리려고 겹쳐 놓은 것이다.
for (const k of ["fence", "mask", "base"]) {
  const el = document.getElementById("t-" + k);
  el.onchange = () => document.body.classList.toggle("no-" + k, !el.checked);
}
</script>
