<!doctype html>
<meta charset="utf-8">
<title>{% block title %}NDD20{% endblock %}</title>
<style>
  :root { --bg:#0b0f14; --panel:#141b23; --line:#26303c; --ink:#e6edf3;
          --dim:#8b98a5; --ok:#4ade80; --warn:#ffd479; --card:200px }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.6 "IBM Plex Sans KR", system-ui, sans-serif }
  a { color:#9fe6ff; text-decoration:none } a:hover { text-decoration:underline }
  header { border-bottom:1px solid var(--line); padding:9px 14px;
           display:flex; gap:12px; align-items:center; flex-wrap:wrap }
  h1 { font-size:15px; margin:0; font-weight:600 }
  .dim { color:var(--dim); font-size:12.5px }
  select, button, input { font:inherit; font-size:13px; background:var(--panel);
    color:var(--ink); border:1px solid var(--line); border-radius:5px;
    padding:3px 9px }
  #grid { display:grid; gap:9px; padding:12px;
          grid-template-columns:repeat(auto-fill, minmax(var(--card), 1fr)) }
  .fin { position:relative; background:#0d1219; border:1px solid var(--line);
         border-radius:6px; overflow:hidden }
  .fin img { display:block; width:100%; height:auto }
  .fin svg { position:absolute; inset:0; width:100%; height:100%;
             pointer-events:none }
  .fin polyline { fill:none; stroke:var(--ok); stroke-width:1.6;
                  vector-effect:non-scaling-stroke; opacity:.9 }
  .fin.open polyline { stroke:var(--warn) }
  .tag { position:absolute; left:4px; top:4px; z-index:2; font-size:11px;
         background:#000a; border-radius:4px; padding:1px 5px }
  .tag.id { color:var(--ok) } .tag.no { color:var(--dim) }
  .gap { position:absolute; right:4px; top:4px; z-index:2; font-size:11px;
         color:var(--warn); background:#000a; border-radius:4px; padding:1px 5px }
  .pager { padding:10px 14px; display:flex; gap:8px; align-items:center }
</style>
<header>
  <h1><a href="/">NDD20</a></h1>
  {% block head %}{% endblock %}
  <span style="flex:1"></span>
  <label class="dim">윤곽 <input type="checkbox" id="ov" checked></label>
</header>
{% block body %}{% endblock %}
<script>
// **윤곽은 브라우저가 얹는다** — 켜고 끌 수 있어야 그림과 좌표가 갈렸을 때
// 어느 쪽이 틀렸는지 가린다 (형제 저장소의 `/edit` 과 같은 까닭).
document.getElementById("ov").onchange = e => {
  document.querySelectorAll(".fin svg").forEach(
    s => s.style.display = e.target.checked ? "" : "none");
};
</script>
